name: MenuBarForGrenton
options:
  bundleIdPrefix: com.osieckiadam
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: pl
  createIntermediateGroups: true
packages:
  GrentonCore:
    url: https://github.com/osieckiAdam/grenton-core-swift
    from: 0.14.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 6VV2KQCWB8
    CODE_SIGN_STYLE: Automatic
targets:
  MenuBarForGrenton:
    type: application
    platform: macOS
    sources:
      - MenuBarForGrenton
    info:
      path: MenuBarForGrenton/Info.plist
      properties:
        CFBundleDisplayName: Menu Bar for Grenton
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: pl
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: Menu Bar for Grenton łączy się ze sterownikami CLU Grenton w Twojej sieci domowej, żeby pokazywać i przełączać światła oraz sterować roletami.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: MenuBarForGrenton/MenuBarForGrenton.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osieckiadam.MenuBarForGrenton
        PRODUCT_NAME: Menu Bar for Grenton
        PRODUCT_MODULE_NAME: MenuBarForGrenton
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: GrentonCore
        product: GrentonKit
      - package: GrentonCore
        product: GrentonSwiftUI
      # Demo mode and SwiftUI previews run on the simulation (NOTES.md A5).
      - package: GrentonCore
        product: GrentonSimulation
  MenuBarForGrentonTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - MenuBarForGrentonTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osieckiadam.MenuBarForGrentonTests
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen derives the host from the target name; the app is named after PRODUCT_NAME.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Menu Bar for Grenton.app/Contents/MacOS/Menu Bar for Grenton"
    dependencies:
      # GrentonSimulation comes from the host app. Linking it here as well
      # makes Xcode build it as a dynamic framework with its own copy of
      # GrentonDevices (NOTES.md D5).
      - target: MenuBarForGrenton
schemes:
  MenuBarForGrenton:
    build:
      targets:
        MenuBarForGrenton: all
        MenuBarForGrentonTests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-DemoMode YES": false
    test:
      config: Debug
      targets:
        - MenuBarForGrentonTests
