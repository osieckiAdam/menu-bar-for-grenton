name: GrentonBar
options:
  bundleIdPrefix: com.osieckiadam
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: pl
  createIntermediateGroups: true
packages:
  GrentonCore:
    url: https://github.com/osieckiAdam/grenton-core-swift
    from: 0.14.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 6VV2KQCWB8
    CODE_SIGN_STYLE: Automatic
targets:
  GrentonBar:
    type: application
    platform: macOS
    sources:
      - GrentonBar
    info:
      path: GrentonBar/Info.plist
      properties:
        CFBundleDisplayName: GrentonBar
        CFBundleDevelopmentRegion: pl
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: GrentonBar łączy się ze sterownikami CLU Grenton w Twojej sieci domowej, żeby pokazywać i przełączać światła oraz sterować roletami.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: GrentonBar/GrentonBar.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osieckiadam.GrentonBar
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: GrentonCore
        product: GrentonKit
      - package: GrentonCore
        product: GrentonSwiftUI
      # Demo mode and SwiftUI previews run on the simulation (NOTES.md A5).
      - package: GrentonCore
        product: GrentonSimulation
  GrentonBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - GrentonBarTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osieckiadam.GrentonBarTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      # GrentonSimulation comes from the host app. Linking it here as well
      # makes Xcode build it as a dynamic framework with its own copy of
      # GrentonDevices (NOTES.md D5).
      - target: GrentonBar
schemes:
  GrentonBar:
    build:
      targets:
        GrentonBar: all
        GrentonBarTests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-GrentonBarDemo YES": false
    test:
      config: Debug
      targets:
        - GrentonBarTests
