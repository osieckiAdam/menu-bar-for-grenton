# Pushing a tag like v0.2.0 builds the app and publishes a GitHub release
# with the zipped "Menu Bar for Grenton.app" (ad-hoc signed, not notarized),
# its SHA-256 and a build provenance attestation.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-26
    steps:
      # Actions are pinned to commits; Dependabot keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Only X.Y.Z tags on commits that are on main get released.
      - name: Check tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must be vX.Y.Z"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }

      # grenton-core-swift needs Swift 6.2.3 or later: take the newest
      # release Xcode on the runner.
      - name: Select Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_[0-9]*.app | grep -viE 'beta|rc' | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build
        run: |
          scripts/build-release.sh "${GITHUB_REF_NAME#v}" "$GITHUB_RUN_NUMBER"
          cd dist && shasum -a 256 "MenuBarForGrenton-${GITHUB_REF_NAME#v}.zip" > "MenuBarForGrenton-${GITHUB_REF_NAME#v}.zip.sha256"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/MenuBarForGrenton-*.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/MenuBarForGrenton-${GITHUB_REF_NAME#v}.zip" \
            "dist/MenuBarForGrenton-${GITHUB_REF_NAME#v}.zip.sha256" \
            --title "Menu Bar for Grenton ${GITHUB_REF_NAME#v}" \
            --generate-notes
