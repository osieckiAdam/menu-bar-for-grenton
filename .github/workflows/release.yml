# Pushing a tag like v0.2.0 builds the app and publishes a GitHub release
# with the zipped "Menu Bar for Grenton.app" (ad-hoc signed, not notarized).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # grenton-core-swift needs Swift 6.2.3 or later: take the newest
      # release Xcode on the runner.
      - name: Select Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_[0-9]*.app | grep -viE 'beta|rc' | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build
        run: scripts/build-release.sh "${GITHUB_REF_NAME#v}" "$GITHUB_RUN_NUMBER"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/MenuBarForGrenton-${GITHUB_REF_NAME#v}.zip" \
            --title "Menu Bar for Grenton ${GITHUB_REF_NAME#v}" \
            --generate-notes
